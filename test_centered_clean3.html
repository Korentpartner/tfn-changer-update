<!DOCTYPE html>
<html>
<head>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body style="width: 1470px; margin: 0; padding: 0; background: #090d16;">
    <div id="pdf-mount-container"></div>
    <div id="status">Starting</div>
    <script>
        async function run() {
            const mount = document.getElementById('pdf-mount-container');
            mount.innerHTML = '';

            const stage = document.createElement('div');
            stage.style.cssText = 'width: 680px; margin: 0 auto; padding: 24px; box-sizing: border-box; background: #ffffff !important; color: #0f172a !important; font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif; line-height: 1.65;';
            stage.innerHTML = '<h1>Delta Airlines Flight Booking Guide</h1><p>Your Complete Guide to Booking Delta Flights</p><p>Delta Airlines is one of the most trusted airlines. Call priority support at <strong>(855) 123-4567</strong>.</p>';
            mount.appendChild(stage);

            await new Promise(r => setTimeout(r, 60));

            const opt = {
                margin: [15, 15, 15, 15],
                filename: 'delta_centered.pdf',
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: {
                    scale: 2,
                    useCORS: true,
                    backgroundColor: '#ffffff'
                },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            const worker = html2pdf().set(opt).from(stage).toPdf();
            const pdf = await worker.get('pdf');
            const datauri = pdf.output('datauristring');
            mount.innerHTML = '';

            const b64 = datauri.split('base64,')[1];
            window.__PDF_BYTES__ = b64;
            document.getElementById('status').innerText = 'DONE_SIZE_' + b64.length;
        }
        window.onload = run;
    </script>
</body>
</html>
