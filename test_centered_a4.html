<!DOCTYPE html>
<html>
<head>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body style="width: 1470px; margin: 0; background: #090d16;">
    <div id="pdf-mount" style="position: absolute; left: 0; top: 0; width: 100%; display: flex; justify-content: center;"></div>
    <div id="res"></div>
    <script>
        async function run() {
            const mount = document.getElementById('pdf-mount');
            const stage = document.createElement('div');
            // Clean A4 sheet centered: 210mm width = 794px @ 96DPI
            stage.style.cssText = 'width: 794px; min-height: 1123px; padding: 48px; box-sizing: border-box; background: #ffffff !important; color: #0f172a !important; font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif; line-height: 1.65;';
            stage.innerHTML = '<h1>Delta Airlines Flight Booking Guide</h1><p>Your Complete Guide to Booking Delta Flights</p><p>Delta Airlines is one of the most trusted airlines. Call priority support at (855) 123-4567.</p>';
            mount.appendChild(stage);

            await new Promise(r => setTimeout(r, 60));

            const opt = {
                margin: 0,
                filename: 'delta_guide.pdf',
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: {
                    scale: 2,
                    useCORS: true,
                    backgroundColor: '#ffffff'
                },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            const worker = html2pdf().set(opt).from(stage).toPdf();
            const pdf = await worker.get('pdf');
            const b64 = pdf.output('datauristring');
            window.__PDF_B64__ = b64;
            document.getElementById('res').innerText = 'LEN_' + b64.length;
        }
        window.onload = run;
    </script>
</body>
</html>
